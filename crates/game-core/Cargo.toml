[package]
name = "alphablokus-game-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
fixedbitset = { version = "0.4.2", features = ["serde"] }
rmp-serde = "1.3.0"
serde = { version = "1.0.219", features = ["derive"] }
tracing = "0.1.41"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
indicatif = { version = "0.18.0", features = ["rayon"] }
rayon = "1.11.0"
zstd = "0.13.3"

[dev-dependencies]
itertools = "0.14.0"
rand = "0.9.2"
