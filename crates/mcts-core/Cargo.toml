[package]
name = "alphablokus-mcts-core"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8.12"
alphablokus-game-core = { path = "../game-core", default-features = false }
anyhow = "1.0.99"
log = "0.4.28"
rand = "0.9.2"
rand_distr = "0.5.1"
serde = { version = "1.0.219", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
